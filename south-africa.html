<!DOCTYPE html>
<html lang="en">
<head>

<body class="sa-page">
  <header class="header page-header">
    <h1 class="wordart"><span class="wordart__line wordart__line--big">South Africa</span></h1>
    <nav class="webring" aria-label="Back">

  <main class="page">
    <article class="window gallery">
      <div class="title-bar">
        <h2 class="title-bar__title"><span class="icon icon--folder" aria-hidden="true"></span>South Africa</h2>
        <div class="title-bar__controls" aria-hidden="true"><span class="ctl ctl--min"></span><span class="ctl ctl--max"></span><span class="ctl ctl--close"></span></div>
